services:
  # ===== BACKEND API =====
  - type: web
    name: ksa-backend
    env: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ksa-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false  # À renseigner manuellement dans Render
      - key: ALLOWED_ORIGINS
        sync: false  # Renseigner l'URL de ton frontend Render
      - key: ADMIN_EMAIL
        value: admin@kingsley.edu
      - key: ADMIN_PASSWORD
        generateValue: true

  # ===== FRONTEND STATIQUE =====
  - type: web
    name: ksa-frontend
    env: static
    region: frankfurt
    plan: free
    rootDir: frontend
    buildCommand: echo "No build needed"
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ===== BASE DE DONNÉES =====
databases:
  - name: ksa-db
    region: frankfurt
    plan: free
    databaseName: ksa_db
    user: ksa_user
